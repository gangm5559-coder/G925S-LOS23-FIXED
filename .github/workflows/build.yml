name: Build LineageOS 23.2 zerolteskt (G925S) FIXED v3 - NoSpace Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space - Aggressive
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20480
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: /home/runner/work/

      - name: Check space
        run: |
          df -h
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Install repo tool only
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo init - shallow
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-22.2 --git-lfs --depth=1 -g default,-mips,-darwin,-notdefault

      - name: Create local manifest - FIXED remote conflict + small vendor
        run: |
          mkdir -p ~/lineage/.repo/local_manifests
          cat > ~/lineage/.repo/local_manifests/roomservice.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="gh7420" fetch="https://github.com/" />
            <project path="device/samsung/universal7420-common" name="LineageOS/android_device_samsung_universal7420-common" remote="github" revision="lineage-22.2" />
            <project path="device/samsung/zerolte-common" name="LineageOS/android_device_samsung_zerolte-common" remote="github" revision="lineage-22.2" />
            <project path="device/samsung/zerolte" name="LineageOS/android_device_samsung_zerolte" remote="github" revision="lineage-22.2" />
            <project path="device/samsung/zeroltexx" name="LineageOS/android_device_samsung_zeroltexx" remote="github" revision="lineage-22.2" />
            <project path="device/samsung/zerolteskt" name="LineageOS/android_device_samsung_zerolteskt" remote="github" revision="lineage-22.2" />
            <project path="device/samsung/noblelte" name="LineageOS/android_device_samsung_noblelte" remote="github" revision="lineage-22.2" />
            <project path="device/samsung/noblelte-common" name="LineageOS/android_device_samsung_noblelte-common" remote="github" revision="lineage-22.2" />
            <project path="kernel/samsung/exynos7420" name="LineageOS/android_kernel_samsung_exynos7420" remote="github" revision="lineage-22.2" />
            <project path="hardware/samsung" name="LineageOS/android_hardware_samsung" remote="github" revision="lineage-22.2" />
          </manifest>
          EOF
          cat ~/lineage/.repo/local_manifests/roomservice.xml

      - name: Repo sync - minimal
        run: |
          cd ~/lineage
          ~/bin/repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j2 --force-sync --fail-fast
          df -h

      - name: Clone vendor minimal
        run: |
          cd ~/lineage
          mkdir -p vendor/samsung
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung.git --depth=1 -b lineage-22.2 vendor/samsung || echo "vendor clone failed but continue"
          df -h

      - name: Setup build env
        run: |
          cd ~/lineage
          source build/envsetup.sh
          lunch lineage_zerolteskt-userdebug || lunch lineage_zeroltexx-userdebug

      - name: Build ROM - no ccache to save space
        run: |
          cd ~/lineage
          source build/envsetup.sh
          export USE_CCACHE=0
          # low jobs to avoid RAM disk full
          mka bacon -j2 2>&1 | tee build.log || mka otapackage -j2

      - name: Check output
        run: |
          ls -lh ~/lineage/out/target/product/zerolteskt/ || ls -lh ~/lineage/out/target/product/zeroltexx/ || ls -lh ~/lineage/out/target/product/
          df -h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-23.2-zerolteskt-G925S-FIXED
          path: |
            ~/lineage/out/target/product/zerolteskt/*.zip
            ~/lineage/out/target/product/zeroltexx/*.zip
            ~/lineage/build.log
          if-no-files-found: warn
